name = "showbox"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Set TMDB_API_KEY as a Cloudflare Worker secret; do not commit API keys.
# Dashboard: Workers & Pages > showbox > Settings > Variables and Secrets.
# CLI: npx wrangler secret put TMDB_API_KEY

# Optional proxy allow-list. If omitted, the /proxy route stays disabled.
# If you enable proxy playback, set ALLOWED_ORIGINS to a comma-separated list
# of approved HTTPS CDN hostnames. Never use an empty allow-list to mean allow-all.
